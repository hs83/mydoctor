<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طبيبي في حلب</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d6efd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طبيبي">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f7fa;
    color: #1a2b3c;
    padding: 16px;
    line-height: 1.6;
  }

  header {
    text-align: center;
    padding: 24px 16px;
    background: linear-gradient(135deg, #0d6efd, #0a58ca);
    color: white;
    border-radius: 16px;
    margin-bottom: 20px;
  }

  header h1 { font-size: 1.8rem; margin-bottom: 6px; }
  header p { font-size: 0.95rem; opacity: 0.9; }

  #installButton {
    display: none;
    width: 100%;
    padding: 14px;
    background: #198754;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(25,135,84,0.3);
  }

  .filters {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: grid;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .filters input,
  .filters select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
  }

  .filters input:focus,
  .filters select:focus {
    outline: none;
    border-color: #0d6efd;
  }

  .filter-actions { display: flex; gap: 8px; }

  .filter-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-apply { background: #0d6efd; color: white; }
  .btn-reset { background: #e9ecef; color: #495057; }

  .count {
    text-align: center;
    color: #6c757d;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .doctors { display: grid; gap: 14px; }

  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .card h3 {
    color: #0d6efd;
    font-size: 1.15rem;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    background: #e7f1ff;
    color: #0a58ca;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-left: 6px;
    margin-bottom: 8px;
  }

  .card p {
    font-size: 0.95rem;
    margin-bottom: 4px;
    color: #495057;
  }

  .card p strong { color: #1a2b3c; }

  /* 🆕 قسم الأرقام */
  .phones-section {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e1e5ea;
  }

  .phones-label {
    font-size: 0.85rem;
    color: #6c757d;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .phone-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }

  .phone-row.single {
    grid-template-columns: 1fr;
  }

  .phone-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: 0.15s;
    border: none;
    cursor: pointer;
    font-family: inherit;
    direction: ltr;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .phone-btn:hover { opacity: 0.9; }

  .btn-call { background: #0d6efd; color: white; }
  .btn-wa { background: #25D366; color: white; }

  .empty {
    text-align: center;
    padding: 40px;
    color: #6c757d;
    background: white;
    border-radius: 12px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: #6c757d;
  }

  footer {
    text-align: center;
    font-size: 0.85rem;
    color: #6c757d;
    margin-top: 30px;
    padding: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>🩺 طبيبي في حلب</h1>
  <p>ابحث عن الطبيب المناسب حسب التخصص والمنطقة</p>
</header>

<button id="installButton">📲 تثبيت التطبيق على الموبايل</button>

<div class="filters">
  <input type="text" id="search" placeholder="🔍 ابحث بالاسم أو التخصص أو المنطقة...">

  <select id="specialty">
    <option value="">كل التخصصات</option>
  </select>

  <select id="area">
    <option value="">كل المناطق</option>
  </select>

  <div class="filter-actions">
    <button id="applyBtn" class="btn-apply">🔎 تطبيق الفلتر</button>
    <button id="resetBtn" class="btn-reset">✖️ مسح</button>
  </div>
</div>

<div class="count" id="count"></div>
<div class="doctors" id="doctors">
  <div class="loading">⏳ جاري تحميل بيانات الأطباء...</div>
</div>

<footer>
  البيانات لأغراض إرشادية فقط — يُرجى التأكد عند الاتصال.<br>
  © 2026 طبيبي في حلب
</footer>

<script>
/* ============================================
   📞 دالة تنسيق الأرقام
   ============================================ */
function formatPhone(raw) {
  // 1. تنظيف من أي رموز
  let p = String(raw).trim().replace(/[^0-9+]/g, '');
  if (!p) return null;

  // 2. إزالة رمز سوريا الدولي إن وُجد
  if (p.startsWith('+963')) p = p.substring(4);
  else if (p.startsWith('963')) p = p.substring(3);

  // 3. إزالة الصفر إن وُجد
  if (p.startsWith('0')) p = p.substring(1);

  // 4. تحديد النوع وإضافة الصفر أو 021
  let phone = '';
  let isMobile = false;

  const len = p.length;

  if (p.startsWith('9') && len === 9) {
    // موبايل: 9xxxxxxxx → 09xxxxxxxx
    phone = '0' + p;
    isMobile = true;
  } else if (p.startsWith('21') && (len === 8 || len === 9)) {
    // أرضي حلب: 21xxxxxxx → 021xxxxxxx
    phone = '0' + p;
    isMobile = false;
  } else if (p.startsWith('2') && (len === 7 || len === 8)) {
    // أرضي حلب بدون 21: 2xxxxxx → 0212xxxxxx
    phone = '021' + p;
    isMobile = false;
  } else {
    // حالات غير متوقعة — نتركها كما هي مع صفر
    phone = p.startsWith('0') ? p : '0' + p;
    isMobile = phone.startsWith('09');
  }

  // 5. صيغة الواتساب
  const whatsapp = isMobile ? ('963' + phone.substring(1)) : null;

  return { phone, whatsapp, isMobile };
}

/* ============================================
   📋 تحليل حقل phones
   ============================================ */
function parsePhones(rawPhones) {
  if (!rawPhones) return [];

  // تقسيم حسب أي فاصل: ; ؛ , \
  const parts = String(rawPhones).split(/[;؛,\\]+/);

  const result = [];
  const seen = new Set();

  for (let part of parts) {
    const trimmed = part.trim();
    if (!trimmed) continue;

    const formatted = formatPhone(trimmed);
    if (!formatted) continue;

    // منع التكرار
    if (seen.has(formatted.phone)) continue;
    seen.add(formatted.phone);

    result.push(formatted);
    if (result.length >= 3) break; // حد أقصى 3
  }

  // ترتيب: موبايل أولاً
  result.sort((a, b) => (b.isMobile ? 1 : 0) - (a.isMobile ? 1 : 0));

  return result;
}

/* ============================================
   🌐 متغيرات عامة
   ============================================ */
let allDoctors = [];
const searchInput = document.getElementById('search');
const specialtySelect = document.getElementById('specialty');
const areaSelect = document.getElementById('area');
const applyBtn = document.getElementById('applyBtn');
const resetBtn = document.getElementById('resetBtn');
const doctorsContainer = document.getElementById('doctors');
const countEl = document.getElementById('count');

/* ============================================
   📥 تحميل البيانات
   ============================================ */
async function loadDoctors() {
  try {
    const res = await fetch('doctors.json');
    if (!res.ok) throw new Error('فشل تحميل الملف');
    allDoctors = await res.json();
    fillSelects();
    renderDoctors(allDoctors);
  } catch (err) {
    doctorsContainer.innerHTML = '<div class="empty">⚠️ تعذّر تحميل بيانات الأطباء</div>';
    console.error(err);
  }
}

/* ============================================
   🔽 تعبئة القوائم المنسدلة
   ============================================ */
function fillSelects() {
  const specialties = [...new Set(allDoctors.map(d => d.specialty).filter(Boolean))].sort();
  const areas = [...new Set(allDoctors.map(d => d.area).filter(Boolean))].sort();

  specialtySelect.innerHTML = '<option value="">كل التخصصات</option>';
  areaSelect.innerHTML = '<option value="">كل المناطق</option>';

  specialties.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    specialtySelect.appendChild(opt);
  });

  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    areaSelect.appendChild(opt);
  });
}

/* ============================================
   🎴 عرض الأطباء
   ============================================ */
function renderDoctors(list) {
  if (list.length === 0) {
    doctorsContainer.innerHTML = '<div class="empty">😕 لا توجد نتائج مطابقة</div>';
    countEl.textContent = '';
    return;
  }

  countEl.textContent = `عدد النتائج: ${list.length}`;

  doctorsContainer.innerHTML = list.map(d => {
    const phones = parsePhones(d.phones);

    const phonesHTML = phones.length > 0 ? `
      <div class="phones-section">
        <div class="phones-label">📱 أرقام التواصل:</div>
        ${phones.map(p => p.isMobile ? `
          <div class="phone-row">
            <a href="tel:${p.phone}" class="phone-btn btn-call">📞 ${p.phone}</a>
            <a href="https://wa.me/${p.whatsapp}" target="_blank" class="phone-btn btn-wa">💬 واتساب</a>
          </div>
        ` : `
          <div class="phone-row single">
            <a href="tel:${p.phone}" class="phone-btn btn-call">📞 ${p.phone}</a>
          </div>
        `).join('')}
      </div>
    ` : '';

    return `
      <div class="card">
        <h3>${d.name || ''}</h3>
        ${d.specialty ? `<span class="badge">${d.specialty}</span>` : ''}
        ${d.area ? `<span class="badge">${d.area}</span>` : ''}
        ${d.address ? `<p><strong>📍 العنوان:</strong> ${d.address}</p>` : ''}
        ${d.hospital ? `<p><strong>🏥 المستشفى:</strong> ${d.hospital}</p>` : ''}
        ${d.hours ? `<p><strong>🕐 أوقات العمل:</strong> ${d.hours}</p>` : ''}
        ${phonesHTML}
      </div>
    `;
  }).join('');
}

/* ============================================
   🔍 الفلترة
   ============================================ */
function filterDoctors() {
  const q = searchInput.value.trim().toLowerCase();
  const sp = specialtySelect.value;
  const ar = areaSelect.value;

  const filtered = allDoctors.filter(d => {
    const matchSearch = !q ||
      (d.name || '').toLowerCase().includes(q) ||
      (d.specialty || '').toLowerCase().includes(q) ||
      (d.area || '').toLowerCase().includes(q);
    const matchSp = !sp || d.specialty === sp;
    const matchAr = !ar || d.area === ar;
    return matchSearch && matchSp && matchAr;
  });

  renderDoctors(filtered);
}

function resetFilters() {
  searchInput.value = '';
  specialtySelect.value = '';
  areaSelect.value = '';
  renderDoctors(allDoctors);
}

searchInput.addEventListener('input', filterDoctors);
specialtySelect.addEventListener('change', filterDoctors);
areaSelect.addEventListener('change', filterDoctors);
applyBtn.addEventListener('click', filterDoctors);
resetBtn.addEventListener('click', resetFilters);

/* ============================================
   📲 زر التثبيت
   ============================================ */
let deferredPrompt;
const installButton = document.getElementById('installButton');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredPrompt) {
    alert('لتثبيت التطبيق: افتح قائمة المتصفح (⋮) ثم اختر "إضافة إلى الشاشة الرئيسية"');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installButton.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installButton.style.display = 'none';
});

/* ▶️ التشغيل */
loadDoctors();
</script>

</body>
 </html>
