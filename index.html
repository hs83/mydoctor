<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل حلب الصحي</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d6efd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دليل حلب الصحي">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f7fa;
    color: #1a2b3c;
    padding: 16px;
    line-height: 1.6;
  }

  header {
    text-align: center;
    padding: 24px 16px;
    background: linear-gradient(135deg, #0d6efd, #0a58ca);
    color: white;
    border-radius: 16px;
    margin-bottom: 20px;
  }

  header h1 { font-size: 1.8rem; margin-bottom: 6px; }
  header p { font-size: 0.95rem; opacity: 0.9; }

  #installButton {
    display: none;
    width: 100%;
    padding: 14px;
    background: #198754;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(25,135,84,0.3);
  }

  .filters {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: grid;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .filters input,
  .filters select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
  }

  .filters input:focus,
  .filters select:focus {
    outline: none;
    border-color: #0d6efd;
  }

  .hidden { display: none !important; }

  .filter-actions { display: flex; gap: 8px; }

  .filter-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-apply { background: #0d6efd; color: white; }
  .btn-reset { background: #e9ecef; color: #495057; }

  .count {
    text-align: center;
    color: #6c757d;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .doctors { display: grid; gap: 14px; }

  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-right: 4px solid #0d6efd;
  }

  .card[data-type="مشفى"] { border-right-color: #dc3545; }
  .card[data-type="طبيب"] { border-right-color: #0d6efd; }
  .card[data-type="صيدلية"] { border-right-color: #198754; }
  .card[data-type="مختبر"] { border-right-color: #6f42c1; }
  .card[data-type="مركز أشعة"] { border-right-color: #fd7e14; }
  .card[data-type="عيادة بصرية"] { border-right-color: #20c997; }
  .card[data-type="عيادات الأسنان"] { border-right-color: #0dcaf0; }
  .card[data-type="عيادة"] { border-right-color: #6c757d; }
  .card[data-type="معالجة فيزيائية"] { border-right-color: #d63384; }

  .card h3 {
    color: #0d6efd;
    font-size: 1.15rem;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    background: #e7f1ff;
    color: #0a58ca;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-left: 6px;
    margin-bottom: 8px;
  }

  .badge-type { background: #fff3cd; color: #664d03; }
  .badge-specialty { background: #d1e7dd; color: #0f5132; }

  .card p {
    font-size: 0.95rem;
    margin-bottom: 4px;
    color: #495057;
  }

  .card p strong { color: #1a2b3c; }

  .phones-section {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e1e5ea;
  }

  .phones-label {
    font-size: 0.85rem;
    color: #6c757d;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .phone-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }

  .phone-row.single { grid-template-columns: 1fr; }

  .phone-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: 0.15s;
    border: none;
    cursor: pointer;
    font-family: inherit;
    direction: ltr;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .phone-btn:hover { opacity: 0.9; }

  .btn-call { background: #0d6efd; color: white; }
  .btn-wa { background: #25D366; color: white; }

  /* 🆕 زر اقتراح التعديل */
  .suggest-section {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e1e5ea;
    text-align: center;
  }

  .suggest-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffe69c;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    font-family: inherit;
    transition: 0.15s;
    cursor: pointer;
  }

  .suggest-btn:hover {
    background: #ffe69c;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: #6c757d;
    background: white;
    border-radius: 12px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: #6c757d;
  }

  footer {
    text-align: center;
    font-size: 0.85rem;
    color: #6c757d;
    margin-top: 30px;
    padding: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>🏥 دليل حلب الصحي</h1>
  <p>ابحث عن طبيب، مشفى، صيدلية، مختبر، أو مركز أشعة</p>
</header>

<button id="installButton">📲 تثبيت التطبيق على الموبايل</button>

<div class="filters">
  <input type="text" id="search" placeholder="🔍 ابحث بالاسم أو العنوان...">

  <select id="type">
    <option value="">كل الأنواع</option>
  </select>

  <select id="specialty">
    <option value="">كل التخصصات</option>
  </select>

  <select id="area">
    <option value="">كل المناطق</option>
  </select>

  <div class="filter-actions">
    <button id="applyBtn" class="btn-apply">🔎 تطبيق الفلتر</button>
    <button id="resetBtn" class="btn-reset">✖️ مسح</button>
  </div>
</div>

<div class="count" id="count"></div>
<div class="doctors" id="doctors">
  <div class="loading">⏳ جاري تحميل البيانات...</div>
</div>

<footer>
  البيانات لأغراض إرشادية فقط — يُرجى التأكد عند الاتصال.<br>
  © 2026 دليل حلب الصحي
</footer>

<script>
/* ============================================
   ⚙️ إعدادات مهمة — عدّل رقم الواتساب هنا
   ============================================ */
const ADMIN_WHATSAPP = "963930783679"; 
// ⚠️ استبدل XXXXXXXXX برقمك بدون الصفر وبدون +
// مثال: إذا رقمك 0955123456 → اكتب: 963955123456

/* ============================================
   📞 تنسيق الأرقام
   ============================================ */
function formatPhone(raw) {
  let p = String(raw).trim().replace(/[^0-9+]/g, '');
  if (!p) return null;

  if (p.startsWith('+963')) p = p.substring(4);
  else if (p.startsWith('963')) p = p.substring(3);
  if (p.startsWith('0')) p = p.substring(1);

  let phone = '';
  let isMobile = false;
  const len = p.length;

  if (p.startsWith('9') && len === 9) {
    phone = '0' + p; isMobile = true;
  } else if (p.startsWith('21') && (len === 8 || len === 9)) {
    phone = '0' + p; isMobile = false;
  } else if (p.startsWith('2') && (len === 7 || len === 8)) {
    phone = '021' + p; isMobile = false;
  } else {
    phone = p.startsWith('0') ? p : '0' + p;
    isMobile = phone.startsWith('09');
  }

  const whatsapp = isMobile ? ('963' + phone.substring(1)) : null;
  return { phone, whatsapp, isMobile };
}

function parsePhones(rawPhones) {
  if (!rawPhones) return [];
  const parts = String(rawPhones).split(/[;؛,\\]+/);
  const result = [];
  const seen = new Set();

  for (let part of parts) {
    const trimmed = part.trim();
    if (!trimmed) continue;
    const formatted = formatPhone(trimmed);
    if (!formatted) continue;
    if (seen.has(formatted.phone)) continue;
    seen.add(formatted.phone);
    result.push(formatted);
    if (result.length >= 3) break;
  }

  result.sort((a, b) => (b.isMobile ? 1 : 0) - (a.isMobile ? 1 : 0));
  return result;
}

/* ============================================
   💬 دالة إنشاء رابط اقتراح التعديل
   ============================================ */
function buildSuggestLink(item) {
  const message = 
`⚠️ *اقتراح تعديل* على بيانات في دليل حلب الصحي:

📌 *الاسم:* ${item.name || '-'}
🏷️ *النوع:* ${item.type || '-'}
📍 *المنطقة:* ${item.area || '-'}
🏠 *العنوان:* ${item.address || '-'}

✏️ *التعديل المقترح:*
[اكتب التعديل هنا...]`;

  return `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
}

/* ============================================
   🌐 متغيرات
   ============================================ */
let allItems = [];
const searchInput = document.getElementById('search');
const typeSelect = document.getElementById('type');
const specialtySelect = document.getElementById('specialty');
const areaSelect = document.getElementById('area');
const applyBtn = document.getElementById('applyBtn');
const resetBtn = document.getElementById('resetBtn');
const doctorsContainer = document.getElementById('doctors');
const countEl = document.getElementById('count');

/* ============================================
   📥 تحميل البيانات
   ============================================ */
async function loadData() {
  try {
    const res = await fetch('doctors.json');
    if (!res.ok) throw new Error('فشل تحميل الملف');
    allItems = await res.json();
    fillSelects();
    updateSpecialtyVisibility();
    renderItems(allItems);
  } catch (err) {
    doctorsContainer.innerHTML = '<div class="empty">⚠️ تعذّر تحميل البيانات</div>';
    console.error(err);
  }
}

/* ============================================
   🔽 تعبئة القوائم
   ============================================ */
function fillSelects() {
  const types = [...new Set(allItems.map(i => i.type).filter(Boolean))].sort();
  const specialties = [...new Set(allItems.map(i => i.specialty).filter(Boolean))].sort();
  const areas = [...new Set(allItems.map(i => i.area).filter(Boolean))].sort();

  typeSelect.innerHTML = '<option value="">كل الأنواع</option>';
  specialtySelect.innerHTML = '<option value="">كل التخصصات</option>';
  areaSelect.innerHTML = '<option value="">كل المناطق</option>';

  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  specialties.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    specialtySelect.appendChild(opt);
  });

  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    areaSelect.appendChild(opt);
  });
}

/* ============================================
   🎯 إظهار/إخفاء فلتر التخصص
   ============================================ */
function updateSpecialtyVisibility() {
  const selectedType = typeSelect.value;
  const shouldShowSpecialty = !selectedType || selectedType === 'طبيب';

  if (shouldShowSpecialty) {
    specialtySelect.classList.remove('hidden');
  } else {
    specialtySelect.classList.add('hidden');
    specialtySelect.value = '';
  }
}

/* ============================================
   🎴 عرض العناصر
   ============================================ */
function renderItems(list) {
  if (list.length === 0) {
    doctorsContainer.innerHTML = '<div class="empty">😕 لا توجد نتائج مطابقة</div>';
    countEl.textContent = '';
    return;
  }

  countEl.textContent = `عدد النتائج: ${list.length}`;

  doctorsContainer.innerHTML = list.map(d => {
    const phones = parsePhones(d.phones);
    const suggestLink = buildSuggestLink(d);

    const phonesHTML = phones.length > 0 ? `
      <div class="phones-section">
        <div class="phones-label">📱 أرقام التواصل:</div>
        ${phones.map(p => p.isMobile ? `
          <div class="phone-row">
            <a href="tel:${p.phone}" class="phone-btn btn-call">📞 ${p.phone}</a>
            <a href="https://wa.me/${p.whatsapp}" target="_blank" class="phone-btn btn-wa">💬 واتساب</a>
          </div>
        ` : `
          <div class="phone-row single">
            <a href="tel:${p.phone}" class="phone-btn btn-call">📞 ${p.phone}</a>
          </div>
        `).join('')}
      </div>
    ` : '';

    return `
      <div class="card" data-type="${d.type || ''}">
        <h3>${d.name || ''}</h3>
        ${d.type ? `<span class="badge badge-type">${d.type}</span>` : ''}
        ${d.specialty ? `<span class="badge badge-specialty">${d.specialty}</span>` : ''}
        ${d.area ? `<span class="badge">${d.area}</span>` : ''}
        ${d.address ? `<p><strong>📍 العنوان:</strong> ${d.address}</p>` : ''}
        ${d.city ? `<p><strong>🌆 المنطقة:</strong> ${d.city}</p>` : ''}
        ${d.hours ? `<p><strong>🕐 أوقات العمل:</strong> ${d.hours}</p>` : ''}
        ${phonesHTML}
        <div class="suggest-section">
          <a href="${suggestLink}" target="_blank" class="suggest-btn">
            ⚠️ هل هذه المعلومة خاطئة؟ اقترح تعديلاً
          </a>
        </div>
      </div>
    `;
  }).join('');
}

/* ============================================
   🔍 الفلترة
   ============================================ */
function filterItems() {
  const q = searchInput.value.trim().toLowerCase();
  const t = typeSelect.value;
  const sp = specialtySelect.value;
  const ar = areaSelect.value;

  const filtered = allItems.filter(d => {
    const matchSearch = !q ||
      (d.name || '').toLowerCase().includes(q) ||
      (d.specialty || '').toLowerCase().includes(q) ||
      (d.area || '').toLowerCase().includes(q) ||
      (d.address || '').toLowerCase().includes(q) ||
      (d.type || '').toLowerCase().includes(q);
    const matchType = !t || d.type === t;
    const matchSp = !sp || d.specialty === sp;
    const matchAr = !ar || d.area === ar;
    return matchSearch && matchType && matchSp && matchAr;
  });

  renderItems(filtered);
}

function resetFilters() {
  searchInput.value = '';
  typeSelect.value = '';
  specialtySelect.value = '';
  areaSelect.value = '';
  updateSpecialtyVisibility();
  renderItems(allItems);
}

searchInput.addEventListener('input', filterItems);
areaSelect.addEventListener('change', filterItems);
specialtySelect.addEventListener('change', filterItems);

typeSelect.addEventListener('change', () => {
  updateSpecialtyVisibility();
  filterItems();
});

applyBtn.addEventListener('click', filterItems);
resetBtn.addEventListener('click', resetFilters);

/* ============================================
   📲 زر التثبيت
   ============================================ */
let deferredPrompt;
const installButton = document.getElementById('installButton');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredPrompt) {
    alert('لتثبيت التطبيق: افتح قائمة المتصفح (⋮) ثم اختر "إضافة إلى الشاشة الرئيسية"');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installButton.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installButton.style.display = 'none';
});

/* ▶️ التشغيل */
loadData();
</script>

</body>
 </html>
